name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from tag
      id: version
      run: |
        $version = $env:Tag -replace '^v', ''
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT
      env:
        Tag: ${{ github.ref_name }}

    - name: Cache Scoop packages
      uses: actions/cache@v4
      with:
        path: |
          ~\scoop
        key: ${{ runner.os }}-scoop-v2
        restore-keys: |
          ${{ runner.os }}-scoop-

    - name: Install FreeBASIC
      shell: powershell
      run: |
        $scoopShims = "$env:USERPROFILE\scoop\shims"
        if (-not (Test-Path "$scoopShims\scoop.ps1")) {
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          irm get.scoop.sh | iex
        }
        $env:PATH = "$scoopShims;$env:PATH"

        # FreeBASIC-winlibs-gcc.json 已从 slug bucket 移除，改名为 freebasic-fbxl.json
        # scoop install 失败时退出码可能仍为 0，因此用 fbc32/fbc64 是否可用来判断，并重试
        $manifest = 'https://github.com/woyxiang/slug/raw/refs/heads/master/bucket/freebasic-fbxl.json'
        $ok = $false
        for ($i = 1; $i -le 3; $i++) {
          scoop install $manifest
          $ok = [bool]((Get-Command fbc32 -ErrorAction SilentlyContinue) -and (Get-Command fbc64 -ErrorAction SilentlyContinue))
          if ($ok) { break }
          Write-Output "FreeBASIC install attempt $i failed, retrying..."
          Start-Sleep -Seconds 10
        }
        if (-not $ok) { throw "FreeBASIC install failed - fbc32/fbc64 not found" }

        # fbc 1.20.1(fbxl 包)只在 bin\win64 下带 GoRC.exe，而 SETRES.bas 的 #cmdline "lang.rc"
        # 会让 fbc32 去 bin\win32 找资源编译器，缺文件时报 error 91
        $fbDir = (scoop prefix freebasic-fbxl).Trim()
        $gorc32 = Join-Path $fbDir 'bin\win32\GoRC.exe'
        if (-not (Test-Path $gorc32)) {
          Copy-Item (Join-Path $fbDir 'bin\win64\GoRC.exe') $gorc32 -Force
          Write-Output "copied GoRC.exe -> $gorc32"
        }

    - name: Compile binaries
      shell: powershell
      run: |
        mkdir 32-bit, 64-bit -Force
        fbc32 -d '__VERSION__=!"${{ steps.version.outputs.VERSION }}"' setres.bas -x 32-bit/setres.exe
        if ($LASTEXITCODE -ne 0) { throw "32-bit build failed (exit code $LASTEXITCODE)" }
        fbc64 -d '__VERSION__=!"${{ steps.version.outputs.VERSION }}"' setres.bas -x 64-bit/setres.exe
        if ($LASTEXITCODE -ne 0) { throw "64-bit build failed (exit code $LASTEXITCODE)" }

    - name: Verify executables
      shell: powershell
      run: |
        if (-not (Test-Path "32-bit/setres.exe")) { throw "32-bit build failed" }
        if (-not (Test-Path "64-bit/setres.exe")) { throw "64-bit build failed" }
        Write-Output "Build successful - files created"

    - name: Package binaries
      shell: powershell
      run: |
        Compress-Archive -Path 32-bit/setres.exe -DestinationPath 32-bit/SETRES-686.zip
        Compress-Archive -Path 64-bit/setres.exe -DestinationPath 64-bit/SETRES-x86-64.zip

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          32-bit/SETRES-686.zip
          64-bit/SETRES-x86-64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
